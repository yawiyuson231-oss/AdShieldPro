  <style>
    :root {
      color-scheme: dark;
      --bg: #02060b;
      --surface: rgba(10, 24, 40, .75);
      --line: rgba(120, 255, 220, .2);
      --text: #eefcf8;

      --dim: #6f8790;
      --emerald: #14e8a2;
      --cyan: #22e4ff;
      --neon: #8dffdc;
      --grad: linear-gradient(120deg, var(--emerald), var(--cyan));
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100vh; min-height: 100dvh; background: var(--bg); color: var(--text); }
    body {
      display: grid; place-items: center; padding: 24px;
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(45% 40% at 20% 18%, rgba(20, 232, 162, .13), transparent 70%),
        radial-gradient(42% 36% at 82% 80%, rgba(34, 228, 255, .11), transparent 70%),
        var(--bg);
    }
    :focus-visible { outline: 2px solid var(--neon); outline-offset: 3px; border-radius: 8px; }
    main {
      width: min(560px, 100%); text-align: center; padding: clamp(28px, 6vw, 48px);
      background: var(--surface); border: 1px solid var(--line); border-radius: 24px;
      box-shadow: 0 30px 80px -30px rgba(0, 0, 0, .85);
    }
    .mark { width: 58px; height: 66px; margin: 0 auto 16px; display: block; filter: drop-shadow(0 0 18px rgba(20, 232, 162, .5)); }
    .code {
      display: inline-block; padding: 5px 12px; border-radius: 99px;
      border: 1px solid var(--line); color: var(--neon);
      font: 700 .75rem ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .16em;
    }
    h1 { font-size: clamp(1.7rem, 5vw, 2.4rem); line-height: 1.12; letter-spacing: -.03em; margin: 16px 0 10px; }
    p { margin: 0 0 24px; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; min-height: 48px;
      padding: 12px 20px; border-radius: 13px; text-decoration: none;
      font-weight: 700; font-size: .84rem; letter-spacing: .08em; text-transform: uppercase;
      border: 1px solid var(--line); color: var(--text); background: rgba(255, 255, 255, .04);
    }
    .btn:hover { border-color: var(--cyan); background: rgba(34, 228, 255, .08); }
    .btn-primary { color: #01170f; background: var(--grad); border-color: transparent; }
    .btn-primary:hover { background: var(--grad); filter: brightness(1.06); }
    .links { margin-top: 22px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 14px; font-size: .88rem; color: var(--dim); }
    .links a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--line); }
    .links a:hover { color: var(--neon); border-color: var(--neon); }
  </style>

    (() => {
      // Resolve site-relative targets cleanly even when 404.html is served from a deep path.
      const base = location.pathname.startsWith('/AdShieldPro/') ? '/AdShieldPro/' : '/';
      document.querySelectorAll('[data-site-rel]').forEach((link) => {
        link.setAttribute('href', base + link.getAttribute('data-site-rel'));
