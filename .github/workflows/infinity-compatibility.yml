name: Infinity DNS Compatibility
on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: JVM tests (InfinityDnsTestSuite + all)
        run: ./gradlew :app:testDebugUnitTest --info
      - name: Compatibility smoke (200 essential + 200 ad domains)
        run: |
          # Runs the JVM smoke that asserts CompatibilityGuard + Video Safety hold
          ./gradlew :app:testDebugUnitTest --tests "com.adshield.pro.InfinityDnsTestSuite"
      - name: Capability / Connector verification
        run: |
          python3 tools/generate_capability_matrix.py
          python3 tools/generate_connector_report.py
          python3 tools/check_ui_performance.py
