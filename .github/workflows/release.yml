name: Release APK

# Publishes a signed, R8-minified AdShield Pro build to GitHub Releases.
#
# Two entry points:
#   1. Manual: "Run workflow" on this branch (no tag needed). Reads the version from
#      app/build.gradle.kts and publishes tag v<versionName>, skipping if it already exists.
#   2. Tag push: push a tag like v2.3.1 and the same pipeline builds and publishes it.
#
# The signing key is generated once and then kept (see "Signing key" below), so every future
# release can upgrade-install over the previous one.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (default: v<versionName> from app/build.gradle.kts)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android SDK
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR=sdkmanager; fi
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          for pkg in "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"; do
            echo "--- $pkg"
            "$SDKMGR" --install "$pkg" 2>&1 | tail -2 || true
          done
          ls "$ANDROID_HOME/platforms"

      - name: Resolve version and tag
        id: meta
        run: |
          set -euo pipefail
          VERSION_NAME="$(grep -oE 'versionName *= *"[^"]+"' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)"/\1/')"
          VERSION_CODE="$(grep -oE 'versionCode *= *[0-9]+' app/build.gradle.kts | head -1 | grep -oE '[0-9]+')"
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="v${VERSION_NAME}"
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk_name=AdShieldPro-${VERSION_NAME}-release.apk" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (versionName=$VERSION_NAME, versionCode=$VERSION_CODE)"

      # Signing key: reuse the key stored in the ADSHIELD_KEYSTORE_BASE64 Actions secret,
      # otherwise reuse the keystore attached to ANY existing release (newest first), otherwise
      # generate one — but only for a first-ever release; with existing releases and no key,
      # fail instead of silently breaking upgrade installs. The key is attached to every release.
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ADSHIELD_KEYSTORE_BASE64 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .ci
          KEYSTORE=/tmp/adshield-release.jks
          STORE_PASS="${ADSHIELD_STORE_PASSWORD:-adshield-release}"
          export KEYSTORE STORE_PASS
          if [ -n "${KEYSTORE_B64:-}" ]; then
            STORE_PASS="${ADSHIELD_STORE_PASSWORD:?set ADSHIELD_STORE_PASSWORD next to ADSHIELD_KEYSTORE_BASE64}"
            export STORE_PASS
            echo "using keystore from ADSHIELD_KEYSTORE_BASE64 secret"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE"
            {
              echo "ADSHIELD_KEYSTORE_PASSWORD=${ADSHIELD_STORE_PASSWORD:?set the ADSHIELD_STORE_PASSWORD secret alongside the keystore}"
              echo "ADSHIELD_KEY_ALIAS=${ADSHIELD_KEY_ALIAS:-adshield}"
              echo "ADSHIELD_KEY_PASSWORD=${ADSHIELD_KEY_PASSWORD:-${ADSHIELD_STORE_PASSWORD}}"
            } >> "$GITHUB_ENV"
          else
            # Scan EVERY release (newest first) for the keystore, not just the latest one:
            # a release that reused an older key does not re-attach it, so the newest release
            # may not carry the asset even though an older one does. Picking only the latest
            # release once silently generated a fresh key and broke upgrade installs.
            # Pattern is a glob: it matches the .keystore name and the .jks name an earlier run used.
            FOUND=""
            FOUND_TAG=""
            for TAG in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
              if gh release download "$TAG" --pattern 'adshield-release.*' --dir /tmp/keystore \
                  --clobber 2>/dev/null; then
                CANDIDATE="$(ls /tmp/keystore/adshield-release.* 2>/dev/null | head -1 || true)"
                if [ -n "$CANDIDATE" ] && [ -s "$CANDIDATE" ]; then
                  FOUND="$CANDIDATE"
                  FOUND_TAG="$TAG"
                  break
                fi
              fi
            done
            if [ -n "$FOUND" ]; then
              echo "reusing keystore attached to release $FOUND_TAG: $FOUND"
              cp "$FOUND" "$KEYSTORE"
              STORE_PASS="${ADSHIELD_STORE_PASSWORD:-adshield-release}"
              echo "STORE_PASS=${STORE_PASS}" >> "$GITHUB_ENV"
              echo "reused=true" >> "$GITHUB_ENV"
            else
              # No keystore on any release. Generating a new one is only safe when no AdShield
              # release has ever shipped; otherwise every existing install would refuse the
              # update (signature mismatch), so fail loudly instead of breaking upgrades.
              if gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -qE '^v[0-9]'; then
                echo "::error::Releases exist but no adshield-release.keystore asset was found on any of them. Set the ADSHIELD_KEYSTORE_BASE64 and ADSHIELD_STORE_PASSWORD repository secrets to the original signing key. Refusing to generate a new key that would break upgrade installs."
                exit 1
              fi
              echo "generating a new release keystore (first-ever release)"
              keytool -genkeypair -v -keystore "$KEYSTORE" -storetype PKCS12 \
                -storepass "$STORE_PASS" -keypass "$STORE_PASS" -alias adshield \
                -keyalg RSA -keysize 4096 -validity 10000 \
                -dname "CN=AdShield Pro, O=AdShield Pro, C=PH" > /dev/null 2>&1
              echo "reused=false" >> "$GITHUB_ENV"
            fi
            {
              echo "ADSHIELD_KEYSTORE_PASSWORD=${STORE_PASS}"
              echo "ADSHIELD_KEY_ALIAS=adshield"
              echo "ADSHIELD_KEY_PASSWORD=${STORE_PASS}"
            } >> "$GITHUB_ENV"
          fi
          echo "ADSHIELD_KEYSTORE_PATH=${KEYSTORE}" >> "$GITHUB_ENV"
          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASS" | tail -3

      - name: UI performance and lazy-list gates
        run: |
          chmod +x tools/check_ui_performance.py
          python3 tools/check_ui_performance.py

      - name: JVM unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Build signed release APK
        run: |
          ./gradlew :app:assembleRelease --no-daemon --console=plain
          ls -l app/build/outputs/apk/release/

      - name: Universal-build gate (blocks the release if the APK is device-specific)
        run: |
          set -euo pipefail
          chmod +x tools/check_universal_release.py
          python3 tools/check_universal_release.py "$(ls app/build/outputs/apk/release/*.apk | head -1)" | tee .ci/universal.log

      # Guard the upgrade path: the new APK must be signed with the same certificate as the
      # previous published release, or Android will refuse to install it as an update.
      - name: Verify signing continuity with the previous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          NEW_APK="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          "$APKSIGNER" verify --print-certs "$NEW_APK" > /tmp/new-certs.txt
          NEW_DIGEST="$(grep -i 'certificate SHA-256 digest' /tmp/new-certs.txt | head -1 | awk '{print $NF}')"
          test -n "$NEW_DIGEST"
          # Newest release that actually shipped an AdShield Pro APK (this repo also holds
          # older OmniShield X releases signed with a different key — skip those).
          PREV_TAG=""
          for TAG in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            if gh release download "$TAG" --pattern 'AdShieldPro-*-release.apk' --dir /tmp/prev --clobber 2>/dev/null; then
              PREV_TAG="$TAG"
              break
            fi
          done
          if [ -z "$PREV_TAG" ]; then
            echo "No previous AdShield Pro release APK; nothing to compare against."
            exit 0
          fi
          PREV_APK="$(ls /tmp/prev/AdShieldPro-*-release.apk | head -1)"
          "$APKSIGNER" verify --print-certs "$PREV_APK" > /tmp/prev-certs.txt
          PREV_DIGEST="$(grep -i 'certificate SHA-256 digest' /tmp/prev-certs.txt | head -1 | awk '{print $NF}')"
          echo "previous ($PREV_TAG): $PREV_DIGEST"
          echo "new build:            $NEW_DIGEST"
          if [ "$NEW_DIGEST" != "$PREV_DIGEST" ]; then
            echo "::error::Signing certificate changed versus $PREV_TAG. Installing this APK over an existing AdShield Pro would fail. Use the original keystore (ADSHIELD_KEYSTORE_BASE64 secret or the adshield-release.keystore release asset)."
            exit 1
          fi
          echo "Signing continuity verified: updates from $PREV_TAG will install over the existing app."

      - name: Verify and package APK
        id: apk
        run: |
          set -euo pipefail
          APK="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          test -s "$APK"
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          unzip -l "$APK" | grep -qE 'classes[0-9]*\.dex'
          unzip -l "$APK" | grep -q 'resources.arsc'
          OUT="${{ steps.meta.outputs.apk_name }}"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | cut -d' ' -f1 > "$OUT.sha256"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          ls -l "$OUT"
          cat "$OUT.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          APK: ${{ steps.apk.outputs.apk }}
        run: |
          set -euo pipefail
          cat > /tmp/notes.md <<EOF
          # AdShield Pro ${{ steps.meta.outputs.version_name }}

          Signed, R8-minified release build from commit \`$GITHUB_SHA\`.

          ## Install
          1. Download \`$APK\`.
          2. Allow installing unknown apps for your browser or file manager when Android asks.
          3. Open the APK and install. Settings, rules and history stay on the device.

          Verify the download if you like: \`sha256sum $APK\` should print
          \`$(cat "$APK.sha256")\`.

          ## What is in this build
          - Private search (DuckDuckGo default or Google), persistent scan journal (up to 200
            records), exportable threat reports, SHA-256 verified file quarantine and optional
            scheduled installed-app scanning.
          - On-device DNS filtering over Android VpnService (no root): ad, tracker and threat lists,
            custom block/allow rules, protection modes, background list sync.
          - Cyber-console dashboard: dark navy/electric-blue threat overview, animated local
            shield, block-mix donut, attack-vector bars and a real DNS activity feed — no
            fictional enterprise endpoints or compliance badges.
          - Aether AI decision core: explainable VERIFIED / SUSPECTED / UNKNOWN verdicts with
            evidence and a user-controlled autonomy ceiling, plus a live network dashboard fed
            only by this device's real DNS log.
          - Battery Intelligence (measured telemetry and charging diagnostics) and Security Center
            (URL/file/APK scanning, installed-app risk audit) — all on-device.
          - 367k offline rules bundled in the APK, so a fresh install protects before any sync.
          - Privacy Browser with request filtering, tracking-parameter stripping and pop-up blocking.
          - Activity, statistics and per-app DNS analytics; AI Smart Boost, storage cleaning,
            Game Booster and battery/thermal tools — all local, no cloud AI.
          - In-app update checks against this repository's own releases.
          - Smoother scrolling: lazy keyed lists, per-tab state isolation, draw-state animation
            that stops when idle, and a scroll-to-top control on long dashboards.

          ## Universal build
          One APK for every device: any native helper library (AndroidX graphics-path,
          DataStore) is bundled for all of arm64-v8a, armeabi-v7a, x86 and x86_64, so it
          installs on Android 10+ (API 29-37) phones, tablets and foldables regardless of CPU.
          Verified by \`tools/check_universal_release.py\` before this release was published.

          ## Notes
          - \`versionCode ${{ steps.meta.outputs.version_code }}\`, \`minSdk 29\`, \`targetSdk 36\`.
          - Built and verified by the "Release APK" workflow (unit tests, APK structure checks,
            universal-build gate, signing-continuity check against the previous release).
          - The signing key is attached below as \`adshield-release.keystore\` so future releases
            can upgrade-install over this one. Treat it as a secret: anyone with it can sign an
            app Android will accept as an update. For real secrecy, move it into the
            \`ADSHIELD_KEYSTORE_BASE64\` / \`ADSHIELD_STORE_PASSWORD\` repository secrets and
            delete the release asset.
          EOF
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "release $TAG already exists: updating its APK assets and release notes"
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
            gh release edit "$TAG" \
              --title "AdShield Pro ${{ steps.meta.outputs.version_name }}" \
              --notes-file /tmp/notes.md
            exit 0
          fi
          git config user.name "AdShield Release"
          git config user.email "release@adshield.local"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "$TAG" || true
          gh release create "$TAG" "$APK" "$APK.sha256" \
            --title "AdShield Pro ${{ steps.meta.outputs.version_name }}" \
            --notes-file /tmp/notes.md \
            --target "$GITHUB_SHA"

      # Always attach the keystore, even when it was reused: the next release looks for the
      # key on existing releases, and a release without the asset is what caused the
      # "latest release has no keystore" bug in the first place.
      - name: Attach signing key for future upgrades
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          cp "$ADSHIELD_KEYSTORE_PATH" /tmp/adshield-release.keystore
          gh release upload "$TAG" /tmp/adshield-release.keystore --clobber

      # Best effort: trigger the real Pages pipeline (docs/ at /, web platform at /app/).
      # Pages has to be switched on once by a repository admin (Settings -> Pages ->
      # Source: GitHub Actions); until then skip cleanly without leaving a failed step.
      - name: Trigger website deploy (GitHub Pages)
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" > /dev/null 2>&1; then
            gh workflow run deploy-website.yml --ref main || true
          else
            echo "GitHub Pages is not enabled yet; skipping website deploy trigger."
          fi

      - name: Upload workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adshield-pro-${{ steps.meta.outputs.version_name }}-release
          path: |
            AdShieldPro-*-release.apk
            AdShieldPro-*-release.apk.sha256
          if-no-files-found: warn
