name: Release APK

# AdShield Pro Secure starts with a new Android identity and a fresh key. Never make
# this package GitHub's repository-wide Latest: that route belongs to legacy installs.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      test_only:
        type: boolean
        default: false

concurrency:
  group: android-secure-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: android-secure-release
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Require a reviewed main commit and Secure signing approval
        env:
          SECURE_CERT: ${{ vars.ADSHIELD_SECURE_APK_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main || "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo '::error::Production and signed migration candidates must be built from reviewed main. Use Android CI previews for branch tests.'
            exit 1
          fi
          if [[ ! "$SECURE_CERT" =~ ^[0-9A-Fa-f]{64}$ ]]; then
            echo '::error::Configure ADSHIELD_SECURE_APK_CERT_SHA256 for a fresh private signer in the android-secure-release environment.'
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install 'platforms;android-37.0' 'platform-tools' 'build-tools;36.0.0'

      - name: Resolve the version and isolated release tag
        id: meta
        env:
          TEST_ONLY: ${{ inputs.test_only }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          from tools.check_universal_release import check_build_config
          problems = []
          config = check_build_config(problems)
          if problems:
              sys.exit('\n'.join(problems))
          version = config['versionName']
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)', version):
              sys.exit('Release version must use canonical major.minor.patch with two-digit minor/patch limits')
          major, minor, patch = map(int, version.split('.'))
          code = 10_000 * major + 100 * minor + patch
          if not 1 <= code <= 2_147_483_647 or code != config['versionCode']:
              sys.exit('Android versionCode must exactly match the Secure release version')
          tag = f'secure-v{version}'
          apk = f'AdShieldPro-Secure-{version}-release.apk'
          if os.environ.get('TEST_ONLY') == 'true':
              tag = f'test-{tag}-run.{os.environ["GITHUB_RUN_ID"]}.{os.environ["GITHUB_RUN_ATTEMPT"]}'
              apk = f'AdShieldPro-Secure-{version}-test.apk'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              print(f'version={version}\ntag={tag}\napk={apk}', file=out)
          PY

      - name: Run regression suites
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/tests
          python3 tools/check_ui_performance.py
          ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --console=plain

      - name: Build with the approved Secure key
        env:
          GH_TOKEN: ${{ github.token }}
          SECURE_VERSION_NAME: ${{ steps.meta.outputs.version }}
          ADSHIELD_SECURE_APK_CERT_SHA256: ${{ vars.ADSHIELD_SECURE_APK_CERT_SHA256 }}
          KEYSTORE_B64: ${{ secrets.ADSHIELD_SECURE_KEYSTORE_BASE64 }}
          ADSHIELD_STORE_PASSWORD: ${{ secrets.ADSHIELD_SECURE_STORE_PASSWORD }}
          ADSHIELD_KEY_ALIAS: ${{ secrets.ADSHIELD_SECURE_KEY_ALIAS }}
          ADSHIELD_KEY_PASSWORD: ${{ secrets.ADSHIELD_SECURE_KEY_PASSWORD }}
        run: bash tools/release_signing.sh build-secure

      - name: Verify exact Secure identity, universal packaging, and signature
        env:
          ADSHIELD_SECURE_APK_CERT_SHA256: ${{ vars.ADSHIELD_SECURE_APK_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          python3 tools/check_universal_release.py "$APK"
          python3 tools/check_apk_native_libs.py "$APK"
          bash tools/release_signing.sh verify-secure "$APK"
          sha256sum "$APK" > "$RUNNER_TEMP/secure-tested-apk.sha256"

      - name: Enable emulator acceleration
        run: |
          set -euo pipefail
          test -c /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            sudo chown "$(id -u):$(id -g)" /dev/kvm
          fi

      - name: Install and launch the signed Secure APK
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          avd-name: adshield-secure-smoke
          emulator-boot-timeout: 300
          disable-linux-hw-accel: false
          script: bash tools/smoke_android_install.sh app/build/outputs/apk/release/app-release.apk emulator-5554 com.adshield.pro.secure

      - name: Publish to the independent Secure channel
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          APK_NAME: ${{ steps.meta.outputs.apk }}
          TEST_ONLY: ${{ inputs.test_only }}
        run: |
          set -euo pipefail
          sha256sum --check "$RUNNER_TEMP/secure-tested-apk.sha256"
          work=$(mktemp -d "$RUNNER_TEMP/secure-release.XXXXXXXX")
          trap 'rm -rf -- "$work"' EXIT
          cp app/build/outputs/apk/release/app-release.apk "$work/$APK_NAME"
          sha256sum "$work/$APK_NAME" | cut -d ' ' -f 1 > "$work/$APK_NAME.sha256"
          legacy_before=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          [[ "$legacy_before" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          title='AdShield Pro Secure'
          if [[ "$TEST_ONLY" == true ]]; then title='AdShield Pro Secure — migration test'; fi
          cat > "$work/notes.md" <<EOF
          **New application ID:** \`com.adshield.pro.secure\`. This is not an update to legacy AdShield Pro and does not share its private data.

          1. Keep the old app installed. Export configuration from **Settings → Backup / Restore** and store the JSON privately.
          2. Download \`$APK_NAME\`, open it from Android Downloads, and approve installation if prompted.
          3. Open **AdShield Pro Secure**, restore the saved configuration, and check your rules and settings before switching. Accounts, API keys, history, and VPN consent do not transfer.

          Built from \`$GITHUB_SHA\`. Android 10+; verified fresh install and launcher on the Android 10 x86_64 emulator.
          SHA-256: \`$(cat "$work/$APK_NAME.sha256")\`.
          GitHub marks this channel as non-Latest so the legacy updater will not offer it.
          EOF
          if [[ "$TEST_ONLY" == true ]]; then
            printf '\n**Test candidate only.** The Secure app updater does not offer test tags.\n' >> "$work/notes.md"
          fi
          # --target does not change an existing tag. Verify its actual commit, or create a
          # new ref atomically, before creating the release. Never attach to another source.
          ref="refs/tags/$TAG"
          refs=$(git ls-remote --tags origin "$ref" "$ref^{}")
          if [[ -n "$refs" ]]; then
            tagged=$(awk -v ref="$ref" '$2 == ref { direct=$1 } $2 == ref "^{}" { peeled=$1 } END { print peeled ? peeled : direct }' <<< "$refs")
            if [[ "$tagged" != "$GITHUB_SHA" ]]; then
              echo "::error::The existing $TAG tag points to another commit. Use a new version."
              exit 1
            fi
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="$ref" -f sha="$GITHUB_SHA" --silent
          fi
          gh release create "$TAG" "$work/$APK_NAME" "$work/$APK_NAME.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false \
            --title "$title ($TAG)" --notes-file "$work/notes.md"
          [[ "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" == true ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" == "$legacy_before" ]]
          printf '## Verified Secure release\n\n[Download APK](https://github.com/%s/releases/download/%s/%s)\n\nLegacy Latest remains `%s`.\n' \
            "$GITHUB_REPOSITORY" "$TAG" "$APK_NAME" "$legacy_before" >> "$GITHUB_STEP_SUMMARY"
