name: Reviewed research intake

# Public metadata only. Never updates code, permissions, filters, models or releases.
# Schedules run on the repository default branch only after this workflow is reviewed/merged.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-intake-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect-review-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore branch-isolated public research history
        uses: actions/cache@v4
        with:
          path: .cache/evolution/research.sqlite
          key: research-v1-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            research-v1-${{ github.ref_name }}-
      - name: Collect unverified Maven-coordinate research references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache/evolution
          python3 -m tools.evolution.research .cache/evolution/research.sqlite --fetch-github
      - name: Retain public research for explicit source/license/relevance review
        uses: actions/upload-artifact@v7
        with:
          name: unverified-research-queue
          include-hidden-files: true
          path: |
            .cache/evolution/research.sqlite
            .cache/evolution/research-report.json
          retention-days: 20
          if-no-files-found: error
