name: Web platform CI

# The Android app has its own pipeline (android-build.yml / release.yml).
# This workflow covers the browser platform: lint, static gates, unit and DOM
# integration tests, and a check that the shipped extension archive is valid.
#
# Note: this file previously contained an invalid multi-line quoted scalar in the
# final step, which made the whole workflow unloadable to Actions. It is now a
# plain block scalar, and `npm run ci` runs the same checks locally.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  web-platform:
    name: Lint, verify, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dev dependencies (jsdom, tests only)
        run: npm install --no-audit --no-fund

      - name: Lint the shipped runtime code
        run: npm run lint

      - name: Static verification (architecture, claims and artifact gates)
        run: npm run verify

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests (the real UI in jsdom)
        run: npm run test:integration

      - name: Check the extension archive is inside Chrome's static-rule limit
        run: node scripts/build-extension.mjs --check

      - name: Assemble the Pages deployment (and verify every precache target exists)
        run: npm run stage

      - name: Summarise the bundled rule set
        run: |
          set -euo pipefail
          count=$(grep -c '^||' assets/core_lite_ads.txt)
          echo "bundled rules: ${count}"
          test "${count}" -ge 70000
