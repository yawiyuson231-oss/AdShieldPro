name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dev dependencies (jsdom for the DOM integration suite)
        run: npm install --no-audit --no-fund

      - name: Static verification (architecture + honesty gates)
        run: npm run verify

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests (real UI in jsdom)
        run: npm run test:integration

      - name: Summarise measured model metrics
        run: node -e "
          const {readFileSync}=require('node:fs');
          const lite=readFileSync('assets/core_lite_ads.txt','utf8');
          console.log('bundled rules:', (lite.match(/^\|\|/gm)||[]).length);
        "
