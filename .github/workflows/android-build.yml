name: Android build & test

on:
  workflow_dispatch:
  push:
    branches:
      - arena/dfe56e37-adshieldpro
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android SDK (API 37 ships as 37.0 / 37.1 / 37.2)
        run: |
          mkdir -p .ci
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR=sdkmanager; fi
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            "$SDKMGR" --version 2>&1 | head -3
            echo "--- available API 37 platforms in the repository ---"
            "$SDKMGR" --list 2>/dev/null | grep -E "platforms;android-3[6-9]\.[0-9]" | head -10
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            for pkg in "platforms;android-37.0" "platforms;android-37.2" "build-tools;36.0.0" "platform-tools"; do
              echo "--- installing $pkg ---"
              "$SDKMGR" --install "$pkg" 2>&1 | tail -4 || true
            done
            echo "--- platforms ---"
            ls "$ANDROID_HOME/platforms" 2>/dev/null | grep -E "^android-3[5-9]" || ls "$ANDROID_HOME/platforms"
            echo "--- build-tools ---"
            ls "$ANDROID_HOME/build-tools" 2>/dev/null
          } 2>&1 | tee .ci/sdk.log
          ls "$ANDROID_HOME/platforms" | grep -qE "^android-37" || { echo "::error::no API 37 platform available"; exit 1; }

      - name: Gradle & JDK versions
        run: |
          chmod +x gradlew
          ./gradlew --version 2>&1 | tee .ci/gradle-version.log

      - name: Compile Kotlin (fails fast on the AGP 9 / Kotlin 2.4 migration)
        run: |
          set -o pipefail
          ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace 2>&1 | tee .ci/compile.log

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee .ci/assemble.log

      - name: JVM unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee .ci/test.log

      - name: Android lint (informational)
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug --no-daemon --stacktrace 2>&1 | tee .ci/lint.log

      - name: Surface Gradle errors as annotations
        if: failure()
        run: |
          cat .ci/*.log 2>/dev/null \
            | grep -E "^e: |FAILURE:|What went wrong|Execution failed|Caused by|Unresolved reference|Could not (resolve|find)|error:" \
            | head -20 | while IFS= read -r line; do echo "::error::$line"; done || true

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: adshield-pro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: |
            .ci/**
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.*
            app/build/test-results/**
          if-no-files-found: ignore

      # The Actions log endpoint is not reachable from every environment, so the
      # raw logs are mirrored into this branch under .ci/ as well.
      - name: Mirror logs into the branch
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          git config user.name "AdShield CI"
          git config user.email "ci@adshield.local"
          git add -f .ci || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "CI logs [skip ci]"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME" || true
