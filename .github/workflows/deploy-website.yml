name: Deploy website

# Publishes the project website to GitHub Pages.
#
#   /            ← docs/            (marketing site, APK links)
#   /app/        ← the web platform (index.html, app.js, modules, feeds)
#
# The web platform is static and uses relative URLs, so serving it from a
# subdirectory works unchanged (its service worker scope is /app/).
# Runs on every change to docs/ or the web platform, and can be triggered by hand.
# Safe to re-run: the job is idempotent and only needs the default token.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'index.html'
      - 'app.js'
      - 'engine.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'assets/**'
      - 'ui/**'
      - 'dns/**'
      - 'aether/**'
      - 'security/**'
      - 'world/**'
      - 'scripts/stage-site.mjs'
      - 'omnishield-x-extension.zip'
      - '.github/workflows/deploy-website.yml'

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    # Production Pages only accepts the protected default branch. Branches use local preview + CI.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check the site files are present
        run: |
          test -s docs/index.html
          grep -q "AdShield Pro" docs/index.html
          test -s index.html
          test -s app.js
          ls -l docs/index.html docs/PRIVACY_POLICY.md

      # Pages must be turned on once with build_type=workflow. A repository admin can do that
      # in Settings -> Pages; the default token cannot, so report it instead of failing silently.
      - name: Report GitHub Pages state
        # Informational only. `actions/configure-pages` below is the authoritative check: it fails
        # with an actionable message when Pages is genuinely unavailable. The REST preflight used to
        # `exit 1` here, which aborted every deploy even though Pages was enabled and correctly set
        # to "GitHub Actions" — a token/permission quirk on the read was treated as a site outage.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if OUT="$(gh api "repos/${GITHUB_REPOSITORY}/pages" 2>&1)"; then
            echo "Pages is enabled: $(echo "$OUT" | head -c 300)"
          else
            echo "::warning::Could not read the Pages settings with this token (continuing; configure-pages decides): $(echo "$OUT" | head -c 300)"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assemble the site
        # Single source of truth: scripts/stage-site.mjs builds _site/ (marketing
        # site at /, web platform at /app/) and fails if any service-worker
        # precache target is missing from the staged tree.
        run: node scripts/stage-site.mjs --out _site

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: pages
        uses: actions/deploy-pages@v4
