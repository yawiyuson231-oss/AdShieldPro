name: Deploy OmniShield X Web Platform

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'
      - main

permissions:
  contents: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run web engine CI tests (real rule files, real ladder)
        run: node website/engine.test.mjs

      - name: Package browser extension
        run: |
          cd extension && zip -q -r ../website/omnishield-x-extension.zip . && cd ..
          echo "Extension zip:" && ls -la website/omnishield-x-extension.zip

      - name: Publish to gh-pages branch
        run: |
          rm -rf /tmp/site && mkdir -p /tmp/site
          cp -r website/. /tmp/site/
          cd /tmp/site
          git init -q -b gh-pages
          git config user.name "omnishield-pages-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "OmniShield X web platform (run ${{ github.run_id }})"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -q origin gh-pages --force
          echo "Published $(find . -type f | wc -l) files to gh-pages"
