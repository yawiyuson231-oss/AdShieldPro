name: Deploy OmniShield X Web Platform

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'
      - main

permissions:
  contents: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run web engine CI tests (real rule files, real ladder)
        run: node website/engine.test.mjs

      - name: Package browser extension
        run: |
          cd extension && zip -q -r ../website/omnishield-x-extension.zip . && cd ..
          echo "Extension zip:" && ls -la website/omnishield-x-extension.zip

      - name: Publish to gh-pages branch
        run: |
          git config user.name "omnishield-pages-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan gh-pages-new
          git rm -rf . --quiet
          mv website/* website/.[!.]* . 2>/dev/null || mv website/* .
          echo "omnishield-x.dev" > CNAME 2>/dev/null || true
          git add -A
          git commit -m "OmniShield X web platform (run ${{ github.run_id }})"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/gh-pages" --force
