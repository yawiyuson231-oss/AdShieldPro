name: Deploy website

# Publishes the project website, with two independent destinations.
#
#   /            ← docs/            (marketing site, APK links)
#   /app/        ← the web platform (index.html, app.js, modules, feeds)
#
# 1. GitHub Pages (primary, needs Pages enabled once by a repository admin).
# 2. The `gh-pages` branch (fallback that needs NO admin click at all).
#    Every run force-pushes the assembled site to `gh-pages` in a single commit,
#    so the site can also be served from a CDN / static host that reads a branch
#    (GitHub Pages "Deploy from a branch", Netlify, Cloudflare Pages, Vercel),
#    or simply downloaded as the run artifact.
#
# The web platform is static and uses relative URLs, so serving it from a
# subdirectory works unchanged (its service worker scope is /app/).
# Runs on every change to docs/ or the web platform, and can be triggered by hand.
# Safe to re-run: both destinations are idempotent.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'docs/**'
      - 'index.html'
      - 'app.js'
      - 'engine.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'assets/**'
      - 'ui/**'
      - 'dns/**'
      - 'aether/**'
      - 'security/**'
      - 'cyber/**'
      - 'scripts/stage-site.mjs'
      - 'omnishield-x-extension.zip'
      - '.github/workflows/deploy-website.yml'

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # required to publish the gh-pages fallback
  pages: write      # required to publish to GitHub Pages
  id-token: write   # required by actions/deploy-pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url || format('https://github.com/{0}/tree/gh-pages', github.repository) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check the site files are present
        run: |
          test -s docs/index.html
          grep -q "AdShield Pro" docs/index.html
          test -s index.html
          test -s app.js
          ls -l docs/index.html docs/PRIVACY_POLICY.md

      # Pages has to exist once with build_type=workflow. Creating it needs repository
      # admin rights, which GITHUB_TOKEN cannot have, so this step only *reports* the
      # state. It must not fail the run: an unenabled Pages site is a setup state, not
      # a broken build, and failing here is what made every deploy after the first
      # green run show up as a red X.
      - name: Report Pages status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" > /dev/null 2>&1; then
            echo "::notice title=Pages enabled::Pages site exists; this run will publish to it."
          else
            echo "::warning title=Pages not enabled::GitHub Pages is not enabled for this repository. A repository admin must open Settings -> Pages and set Source to \"GitHub Actions\" once. The site is fully built and uploaded by this run; the deploy step will be skipped."
          fi

      # enablement: true asks the action to create the Pages site when it is missing.
      # GITHUB_TOKEN usually cannot do that (it needs admin), so this step is allowed
      # to fail and the run continues to build + upload the artifact either way.
      # Creating the Pages site requires repository admin, which the default
      # workflow token is not. If an admin has stored a token with the Pages
      # permission as `PAGES_TOKEN`, create/enable the site here so the rest of
      # this run deploys for real instead of stopping at the branch publish.
      - name: Enable Pages (needs the optional PAGES_TOKEN secret)
        id: enable
        if: ${{ env.PAGES_TOKEN != '' }}
        continue-on-error: true
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          auth="Authorization: Bearer ${PAGES_TOKEN}"
          if [ "$(curl -s -o /dev/null -w '%{http_code}' -H "$auth" "$API")" = "200" ]; then
            echo "Pages is already enabled."
          else
            code=$(curl -s -o /tmp/pages.json -w '%{http_code}' -X POST "$API" \
              -H "$auth" -H 'Accept: application/vnd.github+json' \
              -d '{"build_type":"workflow"}')
            echo "create Pages -> HTTP ${code}"
            [ "$code" = "201" ] || cat /tmp/pages.json
          fi

      - name: Configure Pages
        id: configure
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assemble the site
        # Single source of truth: scripts/stage-site.mjs builds _site/ (marketing
        # site at /, web platform at /app/) and fails if any service-worker
        # precache target is missing from the staged tree.
        run: node scripts/stage-site.mjs --out _site

      - name: Publish to the gh-pages branch (no admin needed)
        # This is the destination that always works: pushing a branch only needs
        # contents:write. One orphan commit per deploy keeps the history flat, and
        # --force means a failed earlier attempt can never block a new one.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          cd _site
          git init -q -b gh-pages .
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "site: ${GITHUB_SHA::12} from ${GITHUB_REF_NAME}"
          git push --force --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "::notice title=gh-pages updated::Branch gh-pages now serves this build (Pages 'Deploy from a branch' can use it directly)."

      # Always upload: the artifact is the deliverable and stays downloadable from the
      # run even when Pages is not switched on yet.
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # Deploy only when Pages is actually available. A skipped deploy is honest;
      # a failed one hides the fact that everything else succeeded.
      - name: Deploy to Pages
        id: pages
        if: steps.configure.outcome == 'success'
        uses: actions/deploy-pages@v4

      - name: Explain what happened
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.pages.outcome }}
          PAGE_URL: ${{ steps.pages.outputs.page_url }}
        run: |
          if [ "$DEPLOY_OUTCOME" = "success" ]; then
            echo "::notice title=Deployed::Site published to ${PAGE_URL}"
          else
            WHO=$(git remote get-url origin | sed -E 's#.*[:/]([^/]+)/([^/]+?)(\.git)?$#\1#')
            REPO=$(git remote get-url origin | sed -E 's#.*[:/]([^/]+)/([^/]+?)(\.git)?$#\2#')
            {
              echo "### Site built and published to the \`gh-pages\` branch"
              echo ""
              echo "GitHub Pages itself is off for this repository. Turning it on needs a"
              echo "repository **admin**, and this workflow's token is not one, so no code"
              echo "change can do it. The site is therefore published to the \`gh-pages\`"
              echo "branch, which any static host can serve as-is."
              echo ""
              echo "**Two clicks to finish (one time, as a repository admin):**"
              echo ""
              echo "1. Create a fine-grained personal access token with **Pages: read and write**"
              echo "   on this repository, and save it as the secret \`PAGES_TOKEN\`."
              echo "   (<https://github.com/settings/personal-access-tokens/new>)"
              echo "2. Open **Settings → Pages → Source: GitHub Actions** — or simply re-run this"
              echo "   workflow once \`PAGES_TOKEN\` exists; it creates the Pages site for you."
              echo ""
              echo "Until then the built site remains downloadable from the artifact below,"
              echo "and it is live on the \`gh-pages\` branch at"
              echo "<https://github.com/${WHO}/${REPO}/tree/gh-pages>."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Deploy skipped::Enable Pages in Settings -> Pages (Source: GitHub Actions) to publish."
          fi
