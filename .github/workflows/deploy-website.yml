name: Deploy website

# Publishes the project website to GitHub Pages.
#
#   /            ← docs/            (marketing site, APK links)
#   /app/        ← the web platform (index.html, app.js, modules, feeds)
#
# The web platform is static and uses relative URLs, so serving it from a
# subdirectory works unchanged (its service worker scope is /app/).
# Runs on every change to docs/ or the web platform, and can be triggered by hand.
# Safe to re-run: the job is idempotent.
#
# Pages enablement: actions/configure-pages@v5 with `enablement: true` turns Pages on
# (Source: GitHub Actions). Creating a Pages site is one of the few operations the default
# GITHUB_TOKEN is never allowed to perform, so an admin must either click Settings -> Pages ->
# Source: GitHub Actions once, or add a fine-grained PAT with "Pages: read and write" as the
# repository secret PAGES_TOKEN (used here when present). Either way the workflow reports the
# exact manual step instead of failing obscurely.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'docs/**'
      - 'index.html'
      - 'app.js'
      - 'engine.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'assets/**'
      - 'ui/**'
      - 'dns/**'
      - 'aether/**'
      - 'security/**'
      - 'omnishield-x-extension.zip'
      - 'scripts/stage-site.mjs'
      - 'scripts/verify-site.mjs'
      - '.github/workflows/deploy-website.yml'

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check the site files are present
        run: |
          test -s docs/index.html
          grep -q "AdShield Pro" docs/index.html
          test -s docs/404.html
          test -s docs/og-image.png
          test -s docs/canonical.txt
          test -s index.html
          test -s app.js
          ls -l docs/index.html docs/404.html docs/og-image.png docs/PRIVACY_POLICY.md

      # The default GITHUB_TOKEN can configure a Pages site but can never create one, so this
      # step is allowed to fail: the next step checks whether Pages exists and prints the exact
      # one-time fix instead of an obscure "Create Pages site failed".
      - name: Configure Pages (enables Pages when the token is allowed to)
        id: pages-config
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          # PAGES_TOKEN (optional) is a PAT that can create the Pages site; falls back to the
          # workflow token, which can configure but not create it.
          token: ${{ secrets.PAGES_TOKEN || secrets.GITHUB_TOKEN }}
          enablement: true

      - name: Explain a Pages site that could not be enabled
        if: steps.pages-config.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" > /dev/null 2>&1; then
            echo "::error::GitHub Pages is already enabled, but configure-pages failed. See the step above."
            exit 1
          fi
          echo "::error::GitHub Pages is not enabled for ${GITHUB_REPOSITORY}, and the token used here cannot create it. Fix it once, either way: (a) open https://github.com/${GITHUB_REPOSITORY}/settings/pages and set Source to \"GitHub Actions\"; or (b) add a repository secret PAGES_TOKEN holding a fine-grained PAT with \"Pages: read and write\", which lets this workflow enable Pages itself. Then re-run this job."
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assemble the site
        # Single source of truth: scripts/stage-site.mjs builds _site/ (marketing site at /,
        # web platform at /app/), generates robots.txt + sitemap.xml, and fails if any
        # service-worker precache target is missing from the staged tree.
        run: node scripts/stage-site.mjs --out _site

      - name: Verify the staged site
        # Gates that only make sense on the assembled tree: every internal link resolves inside
        # _site/, the 404 page does not depend on missing assets, and the sitemap matches the
        # published origin. Runs in CI and locally (`npm run verify:site -- _site`).
        run: node scripts/verify-site.mjs _site

      - name: Summarise what is being published
        run: node scripts/verify-site.mjs _site --summary >> "$GITHUB_STEP_SUMMARY"

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: pages
        uses: actions/deploy-pages@v4

