name: Deploy website

# Publishes the project website to GitHub Pages.
#
#   /            ← docs/            (marketing site, APK links)
#   /app/        ← the web platform (index.html, app.js, modules, feeds)
#
# The web platform is static and uses relative URLs, so serving it from a
# subdirectory works unchanged (its service worker scope is /app/).
# Runs on every change to docs/ or the web platform, and can be triggered by hand.
# Safe to re-run: the job is idempotent and only needs the default token.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'docs/**'
      - 'index.html'
      - 'app.js'
      - 'engine.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'assets/**'
      - 'ui/**'
      - 'dns/**'
      - 'aether/**'
      - 'security/**'
      - 'omnishield-x-extension.zip'
      - '.github/workflows/deploy-website.yml'

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check the site files are present
        run: |
          test -s docs/index.html
          grep -q "AdShield Pro" docs/index.html
          ls -l docs/index.html docs/PRIVACY_POLICY.md

      # Pages must be turned on once with build_type=workflow. A repository admin can do that
      # in Settings -> Pages; the default token cannot, so report it instead of failing silently.
      - name: Ensure GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/pages" > /dev/null 2>&1; then
            echo "::error::GitHub Pages is not enabled for this repository yet. A repository admin must open Settings -> Pages and set Source to \"GitHub Actions\", then re-run this workflow."
            exit 1
          fi
          echo "Pages is enabled."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble the site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          # 1. The existing marketing site keeps the domain root.
          cp -a docs/. _site/
          # 2. The web platform is staged under /app/. Only files the browser
          #    actually needs are copied: no tests, no build scripts, no node_modules.
          mkdir -p _site/app
          cp -a index.html app.js engine.js sw.js manifest.webmanifest _site/app/
          cp -a ui dns aether security assets _site/app/
          rm -rf _site/app/node_modules
          # 3. Fail loudly if the staged app is not self-sufficient.
          test -s _site/app/index.html
          test -s _site/app/app.js
          test -s _site/app/assets/core_lite_ads.txt
          test -s _site/app/omnishield-x-extension.zip || cp -a omnishield-x-extension.zip _site/app/
          test -s _site/app/sw.js
          # Every module the service worker precaches must be present after staging.
          node - <<'NODE'
          const { readFileSync, existsSync } = require('node:fs');
          const sw = readFileSync('_site/app/sw.js', 'utf8');
          const listed = [...sw.matchAll(/'(\.\/[^']+)'/g)].map((m) => m[1]);
          const missing = listed.filter((url) => url !== './' && !existsSync('_site/app/' + url.slice(2)));
          if (missing.length) {
            console.error('missing precached asset(s): ' + missing.join(', '));
            process.exit(1);
          }
          console.log('staged ' + listed.length + ' precached assets');
          NODE
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: pages
        uses: actions/deploy-pages@v4
