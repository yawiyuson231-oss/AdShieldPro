name: Deploy OmniShield X Web Platform

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run web engine CI tests (real rule files, real ladder)
        run: node website/engine.test.mjs

      - name: Package browser extension
        run: |
          cd extension && zip -q -r ../website/omnishield-x-extension.zip . && cd ..
          ls -la website/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
