name: Deploy website

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Assemble & verify site
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages_status.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check the site files are present
        run: |
          test -s docs/index.html
          grep -qi '<title>AdShield Pro' docs/index.html
          test -s index.html
          test -s app.js
          test -s sw.js

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Assemble the site (marketing at /, web platform at /app/)
        run: node scripts/stage-site.mjs --out _site

      - name: Check GitHub Pages enablement
        id: pages_status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api -i "repos/${{ github.repository }}/pages" 2>/dev/null | awk 'NR==1 {print $2}' || true)
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled for ${{ github.repository }} yet (Settings -> Pages -> Source: GitHub Actions). Site assembly succeeded; live Pages upload was skipped."
          fi

      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && steps.pages_status.outputs.enabled == 'true'
        uses: actions/configure-pages@v6

      - name: Upload site artifact for GitHub Pages
        if: github.ref == 'refs/heads/main' && steps.pages_status.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
