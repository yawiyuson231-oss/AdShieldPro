name: Apple battery core

# Compiles and tests the iOS library on a macOS runner.
#
# This is what makes the iOS target verifiable without an Apple developer account: a
# Swift package needs no signing, no provisioning profile and no App Store enrolment to
# build and test. The shipping app needs an Xcode project and a certificate, which is a
# separate step documented in docs/IOS.md.

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/apple.yml'
  pull_request:
    paths:
      - 'ios/**'
  workflow_dispatch:

jobs:
  swift-test:
    name: swift test (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        working-directory: ios
        run: swift build -v

      - name: Test
        id: test
        working-directory: ios
        # Tee the output so a failure can be shown in the step summary even when the
        # Actions log endpoint is unavailable.
        run: |
          set -o pipefail
          swift test 2>&1 | tee /tmp/swift-test.log

      - name: Annotate failures
        if: failure()
        working-directory: ios
        run: |
          # The Actions log download endpoint has been returning EOF for this job, so
          # failures are echoed as annotations instead of being buried in the log.
          if [ -f /tmp/swift-test.log ]; then
            grep -E "error:|XCTAssert.*failed|failed -" /tmp/swift-test.log | sort -u | head -20 | \
              while IFS= read -r line; do
                echo "::error::${line}"
              done
          else
            echo "::error::swift test failed before producing a log"
          fi

      - name: Summarise the test run
        if: always()
        working-directory: ios
        run: |
          set -euo pipefail
          echo "### Apple battery core" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Package: \`ios/Package.swift\` (iOS 16 / macOS 13)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The library holds the measurement and alert rules; it is compiled and" >> "$GITHUB_STEP_SUMMARY"
          echo "tested here on every change. The app shell that wraps it is added in" >> "$GITHUB_STEP_SUMMARY"
          echo "Xcode and needs an Apple developer account to sign." >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/swift-test.log ]; then
            {
              echo ""
              echo "#### Test output (last 40 lines)"
              echo ""
              echo '```'
              tail -40 /tmp/swift-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
