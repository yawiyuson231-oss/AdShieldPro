name: Test APK (pre-release)

# Publishes a signed, R8-minified AdShield Pro APK as a GitHub **pre-release** so it can be
# installed and exercised on a real device *before* the real release is published.
#
# Why a separate pipeline instead of "Release APK" with a different tag:
#   * A pre-release is never returned by /releases/latest, which is the endpoint the in-app
#     updater polls — so testers get the build and existing users are not told to update.
#   * It does not become the repository's "Latest" release, so the website's /releases/latest
#     download link keeps pointing at the shipped version until the real release replaces it.
#   * The tag prefix is `test-`, which cannot match the `v*` tag trigger of release.yml, so a
#     test build can never accidentally publish a real release.
#
# The APK is signed with the SAME release keystore as the published builds (never a throwaway
# key), so a tester's install is upgraded in place by the final release instead of failing on a
# certificate mismatch. The keystore itself is never attached to a test release.
#
# Usage:
#   gh workflow run "Test APK (pre-release)" --ref main
#   gh workflow run "Test APK (pre-release)" --ref main -f source_ref=refs/pull/13/head
#   gh workflow run "Test APK (pre-release)" --ref main -f source_ref=arena/my-branch -f tag=test-v2.10.0-rc2

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Ref to build (branch, tag or refs/pull/<n>/head). Empty = the ref this workflow runs on'
        required: false
        default: ''
      tag:
        description: 'Pre-release tag (default test-v<versionName>); must start with test-'
        required: false
        default: ''
  push:
    tags:
      - 'test-v*'

concurrency:
  group: test-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 0

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android SDK
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR=sdkmanager; fi
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          for pkg in "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"; do
            echo "--- $pkg"
            "$SDKMGR" --install "$pkg" 2>&1 | tail -2 || true
          done
          ls "$ANDROID_HOME/platforms"

      - name: Resolve version, commit and pre-release tag
        id: meta
        run: |
          set -euo pipefail
          VERSION_NAME="$(grep -oE 'versionName *= *"[^"]+"' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)"/\1/')"
          VERSION_CODE="$(grep -oE 'versionCode *= *[0-9]+' app/build.gradle.kts | head -1 | grep -oE '[0-9]+')"
          COMMIT="$(git rev-parse HEAD)"
          SHORT="$(git rev-parse --short HEAD)"
          SOURCE_REF="${{ inputs.source_ref }}"
          if [ -z "$SOURCE_REF" ]; then SOURCE_REF="${GITHUB_REF}"; fi
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="test-v${VERSION_NAME}"
          fi
          # A tag matching release.yml's `v*` trigger would publish a real release and make the
          # test build the repository's Latest. Refuse instead of risking that.
          case "$TAG" in
            v[0-9]*) echo "::error::Tag '$TAG' would trigger the real Release APK pipeline. Use a tag starting with 'test-'."; exit 1 ;;
            test-*) ;;
            *) echo "::error::Test-build tags must start with 'test-' (got '$TAG')."; exit 1 ;;
          esac
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk_name=AdShieldPro-${VERSION_NAME}-test.apk" >> "$GITHUB_OUTPUT"
          echo "Building test APK: versionName=$VERSION_NAME versionCode=$VERSION_CODE commit=$SHORT ref=$SOURCE_REF tag=$TAG"

      # Same key as the published releases, by the same precedence as release.yml:
      #   ADSHIELD_KEYSTORE_BASE64 secret -> keystore attached to any existing release.
      # Unlike release.yml this never generates a key: a test build signed with a throwaway key
      # could not be upgraded over by the real release, which is the whole point of testing it.
      - name: Prepare release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ADSHIELD_KEYSTORE_BASE64 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          KEYSTORE=/tmp/adshield-release.jks
          if [ -n "${KEYSTORE_B64:-}" ]; then
            STORE_PASS="${ADSHIELD_STORE_PASSWORD:?set ADSHIELD_STORE_PASSWORD next to ADSHIELD_KEYSTORE_BASE64}"
            echo "using keystore from ADSHIELD_KEYSTORE_BASE64 secret"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          else
            mkdir -p /tmp/keystore
            FOUND=""
            FOUND_TAG=""
            for TAG in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
              if gh release download "$TAG" --pattern 'adshield-release.*' --dir /tmp/keystore \
                  --clobber 2>/dev/null; then
                CANDIDATE="$(ls /tmp/keystore/adshield-release.* 2>/dev/null | head -1 || true)"
                if [ -n "$CANDIDATE" ] && [ -s "$CANDIDATE" ]; then
                  FOUND="$CANDIDATE"
                  FOUND_TAG="$TAG"
                  break
                fi
              fi
            done
            if [ -z "$FOUND" ]; then
              echo "::error::No release keystore found (no ADSHIELD_KEYSTORE_BASE64 secret and no adshield-release.keystore asset on any release). A test APK must be signed with the release key or it cannot be upgraded by the real release."
              exit 1
            fi
            echo "reusing keystore attached to release $FOUND_TAG"
            cp "$FOUND" "$KEYSTORE"
            STORE_PASS="${ADSHIELD_STORE_PASSWORD:-adshield-release}"
          fi
          {
            echo "ADSHIELD_KEYSTORE_PATH=${KEYSTORE}"
            echo "ADSHIELD_KEYSTORE_PASSWORD=${STORE_PASS}"
            echo "ADSHIELD_KEY_ALIAS=${ADSHIELD_KEY_ALIAS:-adshield}"
            echo "ADSHIELD_KEY_PASSWORD=${ADSHIELD_KEY_PASSWORD:-${STORE_PASS}}"
          } >> "$GITHUB_ENV"
          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASS" | tail -3

      - name: UI performance and lazy-list gates
        run: |
          chmod +x tools/check_ui_performance.py gradlew
          python3 tools/check_ui_performance.py

      - name: JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Build signed release APK
        run: |
          ./gradlew :app:assembleRelease --no-daemon --console=plain
          ls -l app/build/outputs/apk/release/

      - name: Universal-build gate
        run: |
          set -euo pipefail
          chmod +x tools/check_universal_release.py
          python3 tools/check_universal_release.py "$(ls app/build/outputs/apk/release/*.apk | head -1)"

      # A test APK that cannot be installed over the shipped app is a wasted test round.
      - name: Verify signing continuity with the published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          NEW_APK="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          "$APKSIGNER" verify --print-certs "$NEW_APK" > /tmp/new-certs.txt
          NEW_DIGEST="$(grep -i 'certificate SHA-256 digest' /tmp/new-certs.txt | head -1 | awk '{print $NF}')"
          test -n "$NEW_DIGEST"
          PREV_TAG=""
          for TAG in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            if gh release download "$TAG" --pattern 'AdShieldPro-*-release.apk' --dir /tmp/prev --clobber 2>/dev/null; then
              PREV_TAG="$TAG"
              break
            fi
          done
          if [ -z "$PREV_TAG" ]; then
            echo "No published AdShield Pro release APK yet; nothing to compare against."
            exit 0
          fi
          PREV_APK="$(ls /tmp/prev/AdShieldPro-*-release.apk | head -1)"
          "$APKSIGNER" verify --print-certs "$PREV_APK" > /tmp/prev-certs.txt
          PREV_DIGEST="$(grep -i 'certificate SHA-256 digest' /tmp/prev-certs.txt | head -1 | awk '{print $NF}')"
          echo "published ($PREV_TAG): $PREV_DIGEST"
          echo "test build:            $NEW_DIGEST"
          if [ "$NEW_DIGEST" != "$PREV_DIGEST" ]; then
            echo "::error::Test APK is signed with a different certificate than $PREV_TAG, so testers could not install it as an update. Use the original release keystore."
            exit 1
          fi
          echo "Signing continuity verified: this test APK installs over $PREV_TAG."

      - name: Verify and package APK
        id: apk
        run: |
          set -euo pipefail
          APK="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          test -s "$APK"
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          unzip -l "$APK" | grep -qE 'classes[0-9]*\.dex'
          unzip -l "$APK" | grep -q 'resources.arsc'
          OUT="${{ steps.meta.outputs.apk_name }}"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | cut -d' ' -f1 > "$OUT.sha256"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          ls -l "$OUT"
          cat "$OUT.sha256"

      - name: Publish as a pre-release (never Latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          APK: ${{ steps.apk.outputs.apk }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          SOURCE_REF: ${{ steps.meta.outputs.source_ref }}
        run: |
          set -euo pipefail
          cat > /tmp/notes.md <<EOF
          # AdShield Pro ${VERSION_NAME} — TEST BUILD (not published)

          **This is a pre-release for testing only.** It is not the version offered on the
          website, it is never returned as \`latest\`, and the app's own updater will not offer it
          to anyone. Install it, break it, then delete it — the real release replaces it in place.

          | | |
          |---|---|
          | versionName | \`${VERSION_NAME}\` |
          | versionCode | \`${VERSION_CODE}\` |
          | commit | \`${{ steps.meta.outputs.commit }}\` |
          | built from | \`${SOURCE_REF}\` |
          | built at | \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\` |
          | signed with | the published release key (upgrade-installs over the current release) |

          ## Install
          1. Download \`${APK}\`.
          2. Allow installing unknown apps for your browser or file manager when Android asks.
          3. Open the APK. It installs **over** the current AdShield Pro as an update, so settings,
             rules and history are kept.

          Verify the download: \`sha256sum ${APK}\` should print
          \`$(cat "${APK}.sha256")\`.

          ## What this build contains

          \`\`\`
          $(git log --oneline -12)
          \`\`\`

          ## Gates this APK already passed
          JVM unit tests, UI performance/lazy-list gate, R8-minified release build, universal-build
          gate (one APK for arm64-v8a / armeabi-v7a / x86 / x86_64), and a signing-continuity check
          against the last published release.

          Once testing passes, publish the real release with the **Release APK** workflow; that
          creates tag \`v${VERSION_NAME}\`, makes it \`latest\` and points the website at it.
          EOF
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "pre-release $TAG already exists: replacing its APK assets and notes"
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
            gh release edit "$TAG" --title "AdShield Pro ${VERSION_NAME} — TEST BUILD" \
              --notes-file /tmp/notes.md --prerelease
          else
            gh release create "$TAG" "$APK" "$APK.sha256" \
              --title "AdShield Pro ${VERSION_NAME} — TEST BUILD" \
              --notes-file /tmp/notes.md \
              --target "${{ steps.meta.outputs.commit }}" \
              --prerelease
          fi

      # The safety property of this whole pipeline: the test build must not have become the
      # release the updater and the website download link resolve to.
      - name: Assert the published release is untouched
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          PRE="$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)"
          LATEST="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name || true)"
          echo "$TAG prerelease=$PRE latest=$LATEST"
          test "$PRE" = "true" || { echo "::error::$TAG is not marked as a pre-release"; exit 1; }
          test "$LATEST" != "$TAG" || { echo "::error::$TAG became the Latest release; the test build must never replace the published one"; exit 1; }
          echo "Test APK published at $(gh release view "$TAG" --json url --jq .url) — Latest is still $LATEST."

      - name: Upload workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adshield-pro-${{ steps.meta.outputs.version_name }}-test
          path: |
            AdShieldPro-*-test.apk
            AdShieldPro-*-test.apk.sha256
          if-no-files-found: warn
