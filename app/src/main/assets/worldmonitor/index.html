<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self' https://appassets.androidplatform.net https: data: blob:; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://appassets.androidplatform.net blob:; worker-src 'self' https://appassets.androidplatform.net blob:; style-src 'self' 'unsafe-inline' https://appassets.androidplatform.net; img-src 'self' https: data: blob:; connect-src 'self' https: data: blob:;"
  />
  <title>OMNISHIELD X // WORLD MONITOR 2035</title>
  <link rel="stylesheet" href="./vendor/cesium/Widgets/widgets.css" />
  <link rel="stylesheet" href="./worldmonitor.css" />
  <script>
    window.CESIUM_BASE_URL = new URL('./vendor/cesium/', window.location.href).toString();
  </script>
</head>
<body data-style="CYBER_TACTICAL">
  <div id="cesiumContainer" aria-label="Interactive 3D Digital Earth"></div>

  <!-- Split-screen Historical Imagery Comparison Handle -->
  <div id="wmSplitOverlay" class="wm-split-overlay hidden" role="separator" aria-label="Historical imagery comparison slider">
    <div id="wmSplitBadgeLeft" class="wm-split-badge wm-split-badge-left">BEFORE</div>
    <div id="wmSplitBadgeRight" class="wm-split-badge wm-split-badge-right">AFTER</div>
    <div id="wmSplitBar" class="wm-split-bar">
      <div class="wm-split-knob">&#8596;</div>
    </div>
  </div>

  <!-- Experimental Simulation Banner (only visible when Simulation Lab overlay is active) -->
  <div id="wmSimBanner" class="wm-sim-banner hidden">
    EXPERIMENTAL SIMULATION OVERLAY &mdash; NOT A CERTAIN PREDICTION
  </div>

  <!-- Compact Coordinate, Elevation & Attribution Telemetry Bar -->
  <div id="wmTelemetryHud" class="wm-telemetry-hud">
    <span id="wmCoordReadout">LAT 14.6000&deg; LON 120.9842&deg;</span>
    <span class="wm-sep">&middot;</span>
    <span id="wmAltReadout">ALT 14,500 km</span>
    <span class="wm-sep">&middot;</span>
    <span id="wmElevReadout">ELEV 0 m</span>
    <span class="wm-sep">&middot;</span>
    <span id="wmProjReadout">3D GLOBE</span>
    <span id="wmRadarStamp" class="wm-radar-stamp hidden"></span>
  </div>

  <div id="wmAttributionBar" class="wm-attribution-bar">
    CesiumJS (Apache-2.0) &middot; satellite.js (MIT) &middot; Natural Earth &middot; OpenStreetMap &middot; NASA GIBS &middot; USGS &middot; NOAA &middot; CelesTrak
  </div>

  <script src="./vendor/cesium/Cesium.js"></script>
  <script src="./vendor/satellite.min.js"></script>
  <script src="./vendor/topojson-client.min.js"></script>
  <script src="./worldmonitor.js"></script>
</body>
</html>
